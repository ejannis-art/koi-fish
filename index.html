function drawWaterSurface(t){
  ctx.save();

  for(let i=0;i<18;i++){
    const y = (i*97 + (t*.012)%97) % H;
    const x = (i*173 + Math.sin(t*.00018+i*1.7)*W*.16) % W;
    const len = W*(.035 + (i%4)*.018);
    const g = ctx.createLinearGradient(x-len/2,y,x+len/2,y);
    g.addColorStop(0,'rgba(180,235,225,0)');
    g.addColorStop(.5,`rgba(190,235,225,${.018+(i%3)*.009})`);
    g.addColorStop(1,'rgba(180,235,225,0)');
    ctx.strokeStyle=g; ctx.lineWidth=1+(i%3);
    ctx.beginPath(); ctx.moveTo(x-len/2,y);
    ctx.bezierCurveTo(x-len*.2,y-3,x+len*.2,y+3,x+len/2,y-1); ctx.stroke();
  }
  // Kleine Lichtreflexe, die langsam über das Wasser wandern
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<34;i++){
    const x=(i*137 + Math.sin(t*.00022+i)*48 + W)%W;
    const y=(i*83 + Math.cos(t*.00017+i*1.4)*34 + H)%H;
    const a=.025 + (Math.sin(t*.001+i*2)+1)*.018;
    ctx.strokeStyle=`rgba(215,255,246,${a})`;
    ctx.lineWidth=.7+(i%3)*.45;
    ctx.beginPath(); ctx.moveTo(x-5,y); ctx.quadraticCurveTo(x,y-1.8,x+6,y+.5); ctx.stroke();
  }
  // Breite, weich auslaufende Lichtbahnen geben der Wasserfläche mehr Tiefe.
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<6;i++){
    const topX=W*(.08+i*.17)+Math.sin(t*.00012+i*1.8)*W*.055, bottomX=topX+Math.sin(t*.00016+i*.9)*W*.09;
    const width=W*(.035+(i%3)*.014), g=ctx.createLinearGradient(topX,0,bottomX,H);
    g.addColorStop(0,'rgba(170,245,225,0)'); g.addColorStop(.18,'rgba(170,245,225,.027)'); g.addColorStop(.62,'rgba(155,230,220,.018)'); g.addColorStop(1,'rgba(150,225,220,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(topX-width*.18,0); ctx.lineTo(topX+width*.18,0); ctx.lineTo(bottomX+width*.65,H); ctx.lineTo(bottomX-width*.65,H); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

  if (selectedFish && !selectedFish.dead){
    const mins = Math.floor(selectedFish.ageMs / 60000), secs = Math.floor((selectedFish.ageMs % 60000) / 1000);
    fishInfoText.innerHTML = '<b>🐟 ' + selectedFish.species.name + ' #' + selectedFish.id + '</b><br>Art: ' + selectedFish.species.name + '<br>Seltenheit: <span style="color:' + selectedFish.rarity.color + '">' + selectedFish.rarity.name + '</span><br>Produktion: +' + (RARITY_GOLD_PER_MINUTE[selectedFish.rarity.name]||0) + ' Gold/min<br>Alter: ' + mins + ':' + String(secs).padStart(2, '0') + ' min<br>Futteraufnahme: ' + selectedFish.foodLoad.toFixed(1) + ' / ' + OVERFEED_LIMIT + '<br>Status: ' + (followSelected ? 'folgt deinem Zeiger' : 'schwimmt frei');
  }
  if (hintUntil && performance.now() > hintUntil){ interactionHint.style.display = 'none'; hintUntil = 0; }
}
setInteractionHint('Tippe auf ein Ei, um es zu sammeln. Geschlüpfte Fische ziehst du aus dem Inventar ins Wasser.');
requestAnimationFrame(frame);
</script>
