/* ---------- statische Ebenen: Teichgrund & Steinrand ---------- */
function buildStatic(){
  const [c, x] = off(); bottom = c;
  x.fillStyle = '#0c170c'; x.fillRect(0, 0, W, H);
  if (mossImg.complete && mossImg.naturalWidth){ // Moss photograph texture for the pond bed
    const sc = clamp(Math.max(W / 1100, H / 520), 1.4, 3), tw = mossImg.naturalWidth * sc, th = mossImg.naturalHeight * sc;
    for (let ty = 0; ty < H; ty += th) for (let tx = 0; tx < W; tx += tw) x.drawImage(mossImg, tx, ty, tw, th);
    x.save(); x.globalAlpha = .4; x.globalCompositeOperation = 'soft-light'; x.translate(W / 2, H / 2); x.rotate(.6);
    const s2 = sc * 1.8, w2 = mossImg.naturalWidth * s2, h2 = mossImg.naturalHeight * s2, R2 = Math.hypot(W, H) / 2;
    for (let ty = -R2; ty < R2; ty += h2) for (let tx = -R2; tx < R2; tx += w2) x.drawImage(mossImg, tx, ty, w2, h2);
    x.restore();
  }
  for (let i = 0; i < 14; i++){ // helle und dunkle Zonen
    const px = R(0, W), py = R(0, H), r = R(120, 340), light = i % 2;
    const a = x.createRadialGradient(px, py, 0, px, py, r);
    a.addColorStop(0, light ? 'rgba(150,170,60,.14)' : 'rgba(0,8,4,.4)'); a.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = a; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  x.globalCompositeOperation = 'color'; x.fillStyle = SP.tint; x.fillRect(0, 0, W, H); // Jahreszeiten-Färbung
  x.globalCompositeOperation='soft-light'; x.fillStyle='rgba(25,86,91,.2)'; x.fillRect(0,0,W,H);
  const depth=x.createLinearGradient(0,0,0,H); depth.addColorStop(0,'rgba(44,105,112,.09)'); depth.addColorStop(.52,'rgba(12,55,66,.04)'); depth.addColorStop(1,'rgba(1,15,22,.24)');
  x.globalCompositeOperation='source-over'; x.fillStyle=depth; x.fillRect(0,0,W,H);
  const skylight=x.createRadialGradient(W*.2,H*.08,0,W*.2,H*.08,Math.max(W,H)*.82);
  skylight.addColorStop(0,'rgba(182,224,192,.12)'); skylight.addColorStop(.38,'rgba(100,178,165,.055)'); skylight.addColorStop(1,'rgba(36,102,111,0)');
  x.globalCompositeOperation='screen'; x.fillStyle=skylight; x.fillRect(0,0,W,H); x.globalCompositeOperation='source-over';
}
function buildIce(){
  ice = null; if (season !== 3) return;
  const [c, x] = off(); ice = c;
  x.fillStyle = 'rgba(205,230,245,.85)'; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 1.2;
  for (let i = 0; i < 70; i++){ let px = R(0, W), py = R(0, H); x.beginPath(); x.moveTo(px, py); for (let k = 0; k < 5; k++){ px += R(-50, 50); py += R(-50, 50); x.lineTo(px, py); } x.stroke(); }
  x.globalCompositeOperation = 'destination-out'; x.filter = 'blur(7px)'; x.fillStyle = '#000';
  x.beginPath(); x.ellipse(W / 2, H / 2, W / 2 - 120, H / 2 - 120, 0, 0, 7); x.fill();
  for (let i = 0; i < 70; i++){ const a = R(0, 6.283); x.beginPath(); x.arc(W / 2 + Math.cos(a) * (W / 2 - 120), H / 2 + Math.sin(a) * (H / 2 - 120), R(15, 60), 0, 7); x.fill(); }
}
function setSeason(m){ seasonMode = m; season = m < 0 ? autoSeason() : m; SP = SEASONS[season]; fall.length = 0; buildStatic(); buildIce(); btn.textContent = (m < 0 ? '⟳ ' : '') + SP.icon; }

function makeCaustic(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'); x.filter = 'blur(1.3px)';
  x.strokeStyle = 'rgba(210,255,245,.6)'; x.lineWidth = 2.2;
  for (let i = 0; i < 80; i++){
    const px = R(0, 256), py = R(0, 256), r = R(10, 38), a0 = R(0, 6.28), a1 = a0 + R(1.5, 4);
    for (const ox of [-256, 0, 256]) for (const oy of [-256, 0, 256]){ x.beginPath(); x.arc(px + ox, py + oy, r, a0, a1); x.stroke(); }
  }
  return c;
}
const caustic = makeCaustic();
function causticLayer(sc, vx, vy, alpha, t){
  const sz = 256 * sc, ox = ((t * vx) % sz + sz) % sz, oy = ((t * vy) % sz + sz) % sz;
  ctx.globalAlpha = alpha;
  for (let x = -ox; x < W; x += sz) for (let y = -oy; y < H; y += sz) ctx.drawImage(caustic, x, y, sz, sz);
  ctx.globalAlpha = 1;
}


/* ---------- realistischere Wasseroberfläche ---------- */
function drawWaterSurface(t){
  ctx.save();
  // Sanfte, breite Spiegelungen statt gleichförmiger Flächenfarbe
  for(let i=0;i<18;i++){
    const y = (i*97 + (t*.012)%97) % H;
    const x = (i*173 + Math.sin(t*.00018+i*1.7)*W*.16) % W;
    const len = W*(.035 + (i%4)*.018);
    const g = ctx.createLinearGradient(x-len/2,y,x+len/2,y);
    g.addColorStop(0,'rgba(180,235,225,0)');
    g.addColorStop(.5,`rgba(190,235,225,${.028+(i%3)*.012})`);
    g.addColorStop(1,'rgba(180,235,225,0)');
    ctx.strokeStyle=g; ctx.lineWidth=1+(i%3);
    ctx.beginPath(); ctx.moveTo(x-len/2,y);
    ctx.bezierCurveTo(x-len*.2,y-3,x+len*.2,y+3,x+len/2,y-1); ctx.stroke();
  }
  // Kleine Lichtreflexe, die langsam über das Wasser wandern
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<34;i++){
    const x=(i*137 + Math.sin(t*.00022+i)*48 + W)%W;
    const y=(i*83 + Math.cos(t*.00017+i*1.4)*34 + H)%H;
    const a=.035 + (Math.sin(t*.001+i*2)+1)*.022;
    ctx.strokeStyle=`rgba(215,255,246,${a})`;
    ctx.lineWidth=.7+(i%3)*.45;
    ctx.beginPath(); ctx.moveTo(x-5,y); ctx.quadraticCurveTo(x,y-1.8,x+6,y+.5); ctx.stroke();
  }
  // Breite, weich auslaufende Lichtbahnen geben der Wasserfläche mehr Tiefe.
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<6;i++){
    const topX=W*(.08+i*.17)+Math.sin(t*.00012+i*1.8)*W*.055, bottomX=topX+Math.sin(t*.00016+i*.9)*W*.09;
    const width=W*(.035+(i%3)*.014), g=ctx.createLinearGradient(topX,0,bottomX,H);
    g.addColorStop(0,'rgba(170,245,225,0)'); g.addColorStop(.18,'rgba(170,245,225,.027)'); g.addColorStop(.62,'rgba(155,230,220,.018)'); g.addColorStop(1,'rgba(150,225,220,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(topX-width*.18,0); ctx.lineTo(topX+width*.18,0); ctx.lineTo(bottomX+width*.65,H); ctx.lineTo(bottomX-width*.65,H); ctx.closePath(); ctx.fill();
  }
  const sunX=W*(.2+Math.sin(t*.00008)*.035), sunY=H*.06, sun=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.max(W,H)*.72);
  sun.addColorStop(0,'rgba(215,255,226,.11)'); sun.addColorStop(.22,'rgba(160,231,218,.055)'); sun.addColorStop(1,'rgba(140,220,220,0)');
  ctx.fillStyle=sun; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStatic(); buildIce(); makePads();
  motes.length = 0;
  for (let i = 0; i < 45; i++) motes.push({ x: R(0, W), y: R(0, H), r: R(.8, 2.2), vx: R(-.1, .1), vy: R(-.08, .08), a: R(.08, .25) });
}

let inventoryDrag = null;

  const box = inventoryPanel.getBoundingClientRect();
  inventoryPanel.style.left = clamp(e.clientX - inventoryDrag.dx, 0, innerWidth - box.width) + 'px';
  inventoryPanel.style.top = clamp(e.clientY - inventoryDrag.dy, 0, innerHeight - box.height) + 'px';

const stopInventoryDrag = e => { if (inventoryDrag && inventoryDrag.pointerId === e.pointerId) inventoryDrag = null; };

inventoryPanel.addEventListener('dragstart', e => {

inventoryPanel.addEventListener('dragend', () => { draggedFishId = null; });

addEventListener('drop', e => {
  if (draggedFishId === null) return;
  e.preventDefault();
  if (inventoryPanel.contains(e.target)){ draggedFishId = null; return; }
  const index = fishInventory.findIndex(f => f.id === draggedFishId); draggedFishId = null;
  if (index < 0) return;
  if (fishes.filter(f => !f.dead).length >= MAX_POPULATION){ setInteractionHint('Der Teich ist voll. Ein Koi kann gerade nicht eingesetzt werden.'); return; }
  const profile = fishInventory.splice(index, 1)[0];
  fishes.push(new Fish(clamp(e.clientX, 40, W - 40), clamp(e.clientY, 40, H - 40), profile));

  inventoryCount.textContent = eggInventory.length + ' Eier · ' + fishInventory.length + ' Fische';

function updateInventoryTimers(){
  for (const egg of eggInventory){
    const timer = eggSlots.querySelector('[data-egg-timer="' + egg.id + '"]'); if (!timer) continue;

let hintUntil = 0;
function setInteractionHint(message){ interactionHint.textContent = message; interactionHint.style.display = 'block'; hintUntil = performance.now() + 2600; }
function updateInteractionUI(){
  plantBtn.classList.toggle('active', plantMode); bubbleBtn.classList.toggle('active', bubbleMode);
  gardenBtn.classList.toggle('active', pondEditMode); gardenPanel.style.display=pondEditMode?'block':'none';
  gardenBtn.textContent=pondEditMode?'✕ Gestalten beenden':'🪸 Teich gestalten';
  gardenPanel.querySelectorAll('[data-decor]').forEach(tool=>tool.classList.toggle('active',pondEditMode&&tool.dataset.decor===decorType));
  ownedDecorTools.querySelectorAll('[data-owned-decor]').forEach(tool=>tool.classList.toggle('active',pondEditMode&&tool.dataset.ownedDecor===decorType));
  plantBtn.textContent = plantMode ? '✕ Pflanzmodus' : '🌿 Seerose setzen';
  bubbleBtn.textContent = bubbleMode ? '✕ Blasenmodus' : '🫧 Blasen erzeugen';

  fishInfo.style.display = 'block';
  followBtn.textContent = followSelected ? '⏸ Loslassen' : '🐟 Anlocken';
}
function updateFishInfo(){
  if (selectedFish && selectedFish.dead){ selectedFish = null; followSelected = false; updateInteractionUI(); }
  if (selectedFish && !selectedFish.dead){
    const mins = Math.floor(selectedFish.ageMs / 60000), secs = Math.floor((selectedFish.ageMs % 60000) / 1000);
    fishInfoText.innerHTML = '<b>🐟 ' + selectedFish.species.name + ' #' + selectedFish.id + '</b><br>Art: ' + selectedFish.species.name + '<br>Seltenheit: <span style="color:' + selectedFish.rarity.color + '">' + selectedFish.rarity.name + '</span><br>Produktion: +' + (RARITY_GOLD_PER_MINUTE[selectedFish.rarity.name]||0) + ' Gold/min<br>Alter: ' + mins + ':' + String(secs).padStart(2, '0') + ' min<br>Futteraufnahme: ' + selectedFish.foodLoad.toFixed(1) + ' / ' + OVERFEED_LIMIT + '<br>Status: ' + (followSelected ? 'folgt deinem Zeiger' : 'schwimmt frei');
  }
  if (hintUntil && performance.now() > hintUntil){ interactionHint.style.display = 'none'; hintUntil = 0; }
}
